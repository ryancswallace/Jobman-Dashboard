# Disposable local test database; never use these public credentials in production.
services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: dashboard_test
      POSTGRES_PASSWORD: dashboard-synthetic-only
    ports:
      - "127.0.0.1:${JOBMAN_DASHBOARD_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d dashboard_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dashboard-test-postgres:/var/lib/postgresql/data
volumes:
  dashboard-test-postgres:
