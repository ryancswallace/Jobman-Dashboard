name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: node.version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Select pinned npm
        run: npm install --global "npm@$(cat npm.version)" --ignore-scripts --no-audit --fund=false
      - run: npm ci --prefix web
      - run: make repository-check
      - name: Verify repeatable generated files
        run: |
          make update
          git diff --exit-code -- contracts ios/JobmanDashboard.xcodeproj
      - run: make docker-check docker-smoke
      - run: make snapshot
      - run: sudo apt-get update && sudo apt-get install --yes rpm
      - name: Smoke-test package layouts without starting services
        run: make package-smoke
