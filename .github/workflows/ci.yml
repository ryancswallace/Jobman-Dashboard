name: Dashboard CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: dashboard_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dashboard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.5.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: make check
        env:
          JOBMAN_DASHBOARD_TEST_DATABASE_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/dashboard_test?sslmode=disable
      - run: npm run build --prefix web
      - name: Cross-build Linux deployment binaries
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/dashboard-linux-amd64 ./cmd/jobman-dashboard
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/dashboard-linux-arm64 ./cmd/jobman-dashboard
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/log-broker-linux-amd64 ./cmd/jobman-log-broker
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/log-broker-linux-arm64 ./cmd/jobman-log-broker

  iphone:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record Xcode and Swift toolchains
        run: |
          xcodebuild -version
          swift --version
      - name: Test native core
        run: ./ios/scripts/test-core.sh
      - name: Build unsigned iPhone simulator app
        run: ./ios/scripts/build-simulator.sh
