name: Publish Dashboard RC Linux packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published immutable engineering RC (vX.Y.Z-rc.N)
        required: true
        type: string

permissions:
  contents: read
  attestations: read

concurrency:
  group: dashboard-cloudsmith
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: main
    env:
      CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY || 'jobman/dashboard' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate to Cloudsmith with personal API key
        uses: cloudsmith-io/cloudsmith-cli-action@69e169e2ad9bc9a1599c2dff464061a00fe9f8ba # v3.1.1
        with:
          # Personal user API key, matching the other Jobman publishers.
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          cli-version: 1.21.0
          verify-auth: 'true'
      - name: Verify published RC and distribute exact package bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/publish-cloudsmith.py --version "$RELEASE_VERSION"
